<svg width="500" height="500" viewBox="0 0 500 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>FoxyLeads App Icon – Beck+Heun</title>
  <desc>App Icon mit Beck+Heun Branding: Dunkelblauer Hintergrund, stilisierter Fuchskopf, Visitenkarte mit Kamera-Symbol</desc>

  <defs>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="500" height="500" rx="0"/>
    </clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect x="0" y="0" width="500" height="500" fill="#1B3A6B"/>
  <rect x="0" y="330" width="500" height="170" fill="#162f58"/>

  <!-- Stilisierter Fuchskopf -->
  <polygon points="150,40 110,150 200,140" fill="#CC1719"/>
  <polygon points="350,40 390,150 300,140" fill="#CC1719"/>
  <polygon points="120,140 250,330 380,140 310,110 250,125 190,110" fill="#CC1719"/>
  <polygon points="153,58 125,138 188,132" fill="white" opacity="0.15"/>
  <polygon points="347,58 375,138 312,132" fill="white" opacity="0.15"/>
  <polygon points="210,220 250,330 290,220 250,205" fill="#e8221e" opacity="0.5"/>

  <!-- Visitenkarte -->
  <rect x="65" y="330" width="370" height="130" rx="14" fill="white" opacity="0.96"/>
  <rect x="65" y="330" width="370" height="32" rx="14" fill="#CC1719"/>
  <rect x="65" y="346" width="370" height="16" fill="#CC1719"/>

  <!-- Textzeilen -->
  <rect x="88" y="378" width="100" height="9"  rx="4" fill="#1B3A6B" opacity="0.7"/>
  <rect x="88" y="393" width="70"  height="7"  rx="3" fill="#1B3A6B" opacity="0.35"/>
  <rect x="88" y="406" width="130" height="7"  rx="3" fill="#1B3A6B" opacity="0.25"/>
  <rect x="88" y="419" width="90"  height="7"  rx="3" fill="#1B3A6B" opacity="0.25"/>
  <rect x="88" y="432" width="110" height="7"  rx="3" fill="#1B3A6B" opacity="0.2"/>

  <!-- Kamera -->
  <circle cx="366" cy="406" r="30" fill="#1B3A6B"/>
  <circle cx="366" cy="406" r="22" fill="none" stroke="white" stroke-width="3.5"/>
  <circle cx="366" cy="406" r="10" fill="white"/>
  <rect x="351" y="379" width="30" height="8" rx="4" fill="white" opacity="0.5"/>

  <!-- Schriftzug -->
  <text x="250" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white" opacity="0.92" letter-spacing="1">Messe<tspan fill="#CC1719">Leads</tspan></text>
</svg>
